services:
  app:
    build: .
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1200M
        reservations:
          cpus: '0.5'
          memory: 512M
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=900
      - DB_LOGGING=false
    depends_on:
      rustfs:
        condition: service_healthy

  rustfs:
    # Pinned deliberately: RustFS reached GA 2026-09-16 and releases rapidly, so
    # `latest` could change behaviour underfoot.
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    ports:
      - "${RUSTFS_API_HOST_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      # Data directory; the image runs as UID/GID 10001 and a named volume lets
      # Docker manage ownership, so no host-side chown is needed.
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      # Fail fast when credentials are absent rather than starting with the
      # publicly-known default pair (rustfsadmin/rustfsadmin).
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  rustfs_data:
